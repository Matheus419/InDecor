<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>InDecor</title>
    <!-- Text font -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Icons Font -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <!-- Informações iniciais -->
    <main id="container_full">
        
          <section class="container_inicial"> 
            <div class="imagem-container">
              <img src="imagens/hrz-5.jpg" alt="">
              <div class="conteudo">
                <h1 class="conteiner_titulo"><strong>InDecor</strong></h1>
                <h2 class="conteiner_subtitulo">UM EVENTO PARA REVOLUCIONAR A SUA CRIATIVIDADE</h2>
                <p class="conteiner_data">Data do evento: <br><div class="data2"><strong>Domingo, 28 de Maio, a partir das 15h</strong></div></br></p>

                <!-- Formulário -->
                 <div class="formulario">
                  <p>Preencha o formulário para receber os detalhes do evento</p>
                    <div class="tags_info">
                      <p>Nome</p>
                      <input type="text" name="Nome" placeholder="Nome">
                      <p>E-mail</p>
                      <input type="email" name="Email" placeholder="Digite seu melhor email">
                      <p>Telefone</p>
                      <input type="number" name="Numero" placeholder="Número de WhatsApp">
                      <p>Principal interesse</p>
                    </div>
                    <!-- Campos de pesquisa -->
                  <select name="select">
                    <option value="Pesquisa" selected>Selecione</option>
                    <option value="valor1">Valor 1</option>
                    <option value="valor2">Valor 2</option>
                    <option value="valor3">Valor 3</option>
                  </select>

                </div>
                <!-- Campo de inscrever -->
                 <div class="inscrever">
                
                 </div>
              </div>
      
          </section>


    </main>
  </body>
  </html>
